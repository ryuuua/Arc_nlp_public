name: research-site

on:
  pull_request:
    paths:
      - 'docs/site/**'
      - 'scripts/docs/**'
      - 'tests/test_research_site.py'
      - 'src/neureps_arc_nlp/**'
      - '.github/workflows/research-site.yml'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'scripts/docs/**'
      - 'tests/test_research_site.py'
      - 'src/neureps_arc_nlp/**'
      - '.github/workflows/research-site.yml'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the reviewed curated site (including selected source excerpts) publicly'
        type: boolean
        required: true
        default: false
      reviewed_manifest_sha256:
        description: 'SHA-256 of the reviewed source-manifest.json; required when publish=true'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: research-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - name: Install documentation tools only
        run: python -m pip install --disable-pip-version-check -r docs/site/requirements.txt
      - name: Test the publication boundary
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider tests/test_research_site.py
      - name: Build and validate curated site
        run: |
          make research-site
          make research-site-check
      - name: Verify the exact reviewed publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          REVIEWED_MANIFEST_SHA256: ${{ inputs.reviewed_manifest_sha256 }}
          PUBLICATION_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "$PUBLICATION_BRANCH_REF"
          python scripts/docs/build_site.py check --expected-manifest-sha256 "$REVIEWED_MANIFEST_SHA256"
      - name: Upload only the reviewed site
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/delivery/research_site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages for the explicitly requested publication
        uses: actions/configure-pages@v5
      - name: Deploy the reviewed site
        id: deployment
        uses: actions/deploy-pages@v4
