[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "neureps-arc-nlp"
version = "0.3.0"
description = "Portable Standard v2/v3/v4 archetypal analysis and research documentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hydra-core>=1.3,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.2",
]
test = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
docs = [
  "markdown-it-py==4.0.0",
  "mdurl==0.1.2",
  "Jinja2==3.1.6",
  "MarkupSafe==3.0.2",
  "Pygments==2.19.2",
]

[project.urls]
Repository = "https://github.com/ryuuua/Arc_nlp_public"
Documentation = "https://ryuuua.github.io/Arc_nlp_public/"

[project.scripts]
neureps-aa = "neureps_arc_nlp.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neureps_arc_nlp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "src/neureps_arc_nlp/solver.py",
  "src/neureps_arc_nlp/standard_aa_v3.py",
  "src/neureps_arc_nlp/standard_aa_v4.py",
  "src/neureps_arc_nlp/aa_stopping_policy.py",
  "src/neureps_arc_nlp/aa_runtime_v2.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
