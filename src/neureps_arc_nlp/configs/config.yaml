defaults:
  - condition: ag_news__deepseek_r1_distill_qwen_14b
  - solver: paper_v2
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

k: 90
seed: 0

input:
  path: ${oc.env:AA_EMBEDDING_ROOT,embeddings}/${condition.dataset}__${condition.model}.npz
  keys:
    train: X_train
    valid: X_valid
    labels_valid: labels_valid

output:
  overwrite: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
